<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>작업 영역 진동 게이지 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#203e60;font:16px/1.6 'Malgun Gothic','Segoe UI',sans-serif}main{max-width:1120px;margin:auto;padding:22px 24px 4px}.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stage{font:600 17px 'Malgun Gothic','Segoe UI',sans-serif;border:1px solid #d9e2ec;border-radius:9px;background:#f3f6fa;color:#75869b;padding:17px 10px;cursor:pointer}.stage[aria-pressed="true"]{background:#e9f2fc;border-color:#315f91;color:#203e60;box-shadow:inset 0 3px #315f91}.stage:focus-visible{outline:3px solid #b58e43;outline-offset:3px}svg{display:block;width:100%;height:auto;margin-top:12px}@media(max-width:600px){main{padding:12px 7px 0}.stages{gap:5px}.stage{font-size:13px;padding:13px 3px}}
</style>
</head>
<body><main>
<div class="stages" role="group" aria-label="제어 단계">
<button class="stage" data-stage="0" aria-pressed="true">① 제어 없음</button>
<button class="stage" data-stage="1" aria-pressed="false">② 병진 제어</button>
<button class="stage" data-stage="2" aria-pressed="false">③ 회전 제어</button>
</div>
<svg viewBox="0 0 1000 500" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">작업 영역의 크기에 따른 병진·회전 제어</title>
<desc id="figure-desc">제어 없음에서 상판이 수직 이동하고 기울어진다. 병진 제어에서는 중심 주위의 작은 작업 영역을 표시한다. 회전 제어 단계에서 작업 영역이 서서히 넓어지고 회전 운동이 줄어든다.</desc>
<g id="side-scene" transform="translate(-18 38) scale(.78)">
<defs><linearGradient id="workspace-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f3fb"/><stop offset="1" stop-color="#dceaf5"/></linearGradient></defs>
<g font-family="Malgun Gothic,sans-serif" fill="#536b84">

</g>
<path d="M100 420H920" stroke="#859aaf" stroke-width="2"/>
<g fill="none" stroke="#8296aa" stroke-width="3.4" stroke-linejoin="round">
<path id="spring-left"/><path id="spring-right"/>
</g>
<path d="M95 285H925" stroke="#a9b9c9" stroke-width="1.4" stroke-dasharray="7 6"/>
<g id="platform">
<rect id="workspace" x="-37.5" y="-39" width="75" height="39" fill="none" stroke="#315f91" stroke-width="1.5" stroke-dasharray="7 5"/>
<text id="workspace-label" x="0" y="-13.5" text-anchor="middle" fill="#254e76" font-family="Malgun Gothic,sans-serif" font-size="12">작업 영역</text>
<path d="M-320 0H320V30H-320Z" fill="#dbe4ed" stroke="#294b6d" stroke-width="1.8"/>
<g id="specimens" aria-label="작업 영역이 넓어지며 추가되는 시료"/>
<rect x="175" y="-70" width="120" height="70" fill="#dfb071" stroke="#99703b" stroke-width="1.6"/>
<text x="235" y="-27" text-anchor="middle" fill="#75512b" font-family="Malgun Gothic,sans-serif" font-size="17">하중</text>
</g>
<g font-family="Malgun Gothic,sans-serif" fill="#536b84" font-size="16"><text x="500" y="337" text-anchor="middle">중심</text></g>
<g transform="translate(55 354)" stroke="#31577e" stroke-width="1.8" fill="none"><path d="M0 42V0M0 42H43"/></g>
<g fill="#31577e" font-family="Consolas,monospace" font-size="15"><text x="45" y="346">Z</text><text x="105" y="402">X</text></g>

</g>
<defs><marker id="measurement-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#6f91b6" stroke-width="1.2"/></marker></defs>
<g id="measurement-indicator" fill="none" stroke="#6f91b6">
<path id="measurement-connector" stroke-width="1.6" stroke-dasharray="5 5" stroke-linejoin="round" marker-end="url(#measurement-arrow)"/>
</g>
<text x="690" y="145" text-anchor="middle" fill="#315f91" font-size="16" font-family="Malgun Gothic,sans-serif">최대 진동 측정</text>
<text x="45" y="52" font-size="19" font-weight="600" fill="#203e60" font-family="Malgun Gothic,sans-serif">제진대 상판 · 측면도</text>
<path d="M760 70V440" stroke="#e1e7ee" stroke-width="1"/>
<g id="vibration-gauge" font-family="Malgun Gothic,sans-serif">
<text x="875" y="63" text-anchor="middle" fill="#203e60" font-size="18" font-weight="600">영역 내 최대 진동</text>
<text x="875" y="89" text-anchor="middle" fill="#73849a" font-size="13">목표 대비 크기</text>
<text id="gauge-value" x="875" y="125" text-anchor="middle" fill="#bd5945" font-size="26" font-weight="600">2.71×</text>
<rect x="848" y="153" width="54" height="247" rx="5" fill="#f4f6f9"/>
<path d="M848 320.3125H902V395Q902 400 897 400H853Q848 400 848 395Z" fill="#e5eff8"/>
<rect id="gauge-fill" x="858" y="183" width="34" height="217" rx="3" fill="#c2634c"/>
<g fill="#8493a5" font-family="Consolas,monospace" font-size="13">
<text x="914" y="404">0</text><text x="914" y="245">2</text><text x="914" y="166">3</text>
</g>
<path d="M819 320.3125H932" stroke="#315f91" stroke-width="2" stroke-dasharray="5 3"/>
<text x="815" y="325" text-anchor="end" fill="#315f91" font-size="14" font-weight="600">목표</text>
<text x="938" y="325" fill="#315f91" font-family="Consolas,monospace" font-size="14">1</text>
</g>
</svg>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),duration=[4200,5200,13700],rotationStart=8200;
let stage=0,elapsed=0,total=0,last=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const specimenPositions=[-264,-210,-156,-102,-48,0,48,96,144];
const specimenNodes=specimenPositions.map((x,k)=>{
 const ns='http://www.w3.org/2000/svg',node=document.createElementNS(ns,'g');
 node.setAttribute('transform',`translate(${x} 0)`);node.setAttribute('data-specimen-x',x);
 node.innerHTML=`<rect x="-16" y="-5" width="32" height="5" rx="1" fill="#e3edf1" stroke="#748e9d" stroke-width="1"/><rect x="-10" y="-${17+k%3*2}" width="20" height="${12+k%3*2}" rx="2" fill="#bddbd4" stroke="#5f8b83" stroke-width="1.1"/><path d="M-7 -10H7" stroke="#e5f4ef" stroke-width="1.2"/>`;
 $('specimens').appendChild(node);return node;
});
const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};
function state(){
 const expansion=stage===2?smooth((elapsed-1000)/2200):0;
 const width=75+525*expansion,height=39+39*expansion;
 const translation=stage===0?19:stage===1?1.1+17.9*(1-smooth(elapsed/1250)):1.1;
 const rotation=stage===2?.075-(.075-.008)*smooth((elapsed-rotationStart)/2400):.075;
 const seconds=total/1000;
 const bound=translation+(width/2)*Math.abs(Math.sin(rotation));
 return {stage,elapsed,width,height,translation,rotation,bound,ratio:bound/8,dy:translation*Math.sin(2*Math.PI*.78*seconds),theta:rotation*Math.sin(2*Math.PI*.61*seconds+.65)};
}
function spring(x,topY,baseY){let d=`M${x} ${topY}v9`;const start=topY+9,end=baseY-10;for(let k=1;k<=10;k++)d+=`L${x+(k%2?12:-12)} ${start+(end-start)*k/11}`;return d+`L${x} ${end}V${baseY}`;}
function render(){
 const s=state(),half=s.width/2,angle=s.theta*180/Math.PI;
 const activeStage=stage===2&&elapsed<rotationStart?1:stage;
 document.querySelectorAll('.stage').forEach((button,k)=>{const pressed=String(k===activeStage);if(button.getAttribute('aria-pressed')!==pressed)button.setAttribute('aria-pressed',pressed);});
 $('platform').setAttribute('transform',`translate(500 ${285+s.dy}) rotate(${angle})`);
 $('workspace').setAttribute('x',-half);$('workspace').setAttribute('width',s.width);$('workspace').setAttribute('y',-s.height);$('workspace').setAttribute('height',s.height);
 $('workspace-label').setAttribute('y',-s.height+14+6*(s.height-39)/39);$('workspace-label').setAttribute('font-size',12+7*(s.height-39)/39);
 specimenNodes.forEach((node,k)=>{
  const visible=stage===2||specimenPositions[k]===0;
  node.setAttribute('opacity',1);node.style.display=visible?'':'none';
 });
 // 작업 영역 윗변의 중심 (local x=0, y=-height)을 화면 좌표로 변환한다.
 const measureX=-18+.78*(500+s.height*Math.sin(s.theta));
 const measureY=38+.78*(285+s.dy-s.height*Math.cos(s.theta));
 $('measurement-connector').setAttribute('d',`M${measureX} ${measureY}V160H840`);

 const ratio=s.ratio,fillHeight=Math.min(3.1,ratio)/3.1*247;
 $('gauge-fill').setAttribute('y',400-fillHeight);$('gauge-fill').setAttribute('height',fillHeight);
 const color=ratio>1?'#c2634c':'#315f91';$('gauge-fill').setAttribute('fill',color);$('gauge-value').setAttribute('fill',color);$('gauge-value').textContent=ratio.toFixed(2)+'×';
 for(const[id,localX]of [['spring-left',-230],['spring-right',230]]){
  const x=500+localX*Math.cos(s.theta)-30*Math.sin(s.theta),y=285+s.dy+localX*Math.sin(s.theta)+30*Math.cos(s.theta);
  $(id).setAttribute('d',spring(x,y,420));
 }
}
function select(i,startMs=0){stage=i;elapsed=startMs;render();}
document.querySelectorAll('.stage').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.stage);select(i,i===2?rotationStart:0);}));
function tick(now){if(last&&playing&&!document.hidden){const dt=Math.min(now-last,100);elapsed+=dt;total+=dt;if(elapsed>=duration[stage])select((stage+1)%3);else render();}last=now;requestAnimationFrame(tick);}
window.sideAnimation={select,pause:()=>{playing=false;},seek:ms=>{elapsed=Math.max(0,Math.min(duration[stage],ms));render();},getState:state};
select(0);requestAnimationFrame(tick);
if(parent!==window){const main=document.querySelector('main');const resize=()=>parent.postMessage({type:'workspace-animation-height',height:Math.ceil(main.getBoundingClientRect().height+2)},'*');new ResizeObserver(resize).observe(main);resize();document.fonts.ready.then(resize);}
})();
</script></body></html>
